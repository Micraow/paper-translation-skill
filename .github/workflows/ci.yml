name: Test skill and XeLaTeX template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    name: PDF tooling regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python scripts
        run: python -m compileall -q scripts tests
      - name: Synthetic PDF and LaTeX lint tests
        run: python -m unittest discover -s tests -v

  latex:
    name: XeLaTeX demonstration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install LaTeX and CJK fonts
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-lang-chinese \
            texlive-science texlive-fonts-recommended fonts-lmodern fonts-noto-cjk
      - name: Check Latin Modern OpenType availability
        run: |
          for font in lmroman10-regular.otf lmromancaps10-regular.otf lmsans10-regular.otf lmmonolt10-regular.otf; do
            if ! kpsewhich "$font" | grep -q .; then
              echo "::error::Missing $font. Install fonts-lmodern / lmodern."
              exit 1
            fi
          done
      - name: Initialize an independent project
        run: python scripts/init_project.py /tmp/paper-translation-smoke
      - name: Compile and audit example
        run: make -C /tmp/paper-translation-smoke
      - name: Ensure native citation links work
        run: |
          python /tmp/paper-translation-smoke/scripts/audit_pdf.py \
            /tmp/paper-translation-smoke/build/paper-final.pdf --mode native --strict
      - name: Verify scientific typography and algorithm anchors
        run: python tests/typography_smoke.py /tmp/paper-translation-smoke
